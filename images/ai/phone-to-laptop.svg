<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <!-- Phone -->
  <g id="phone">
    <rect x="50" y="80" width="120" height="200" rx="10" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
    <rect x="60" y="100" width="100" height="160" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
    <!-- Screen content - idea note -->
    <text x="110" y="130" font-family="monospace" font-size="10" fill="#333" text-anchor="middle">Idea:</text>
    <text x="110" y="145" font-family="monospace" font-size="9" fill="#666" text-anchor="middle">Add metrics</text>
    <text x="110" y="158" font-family="monospace" font-size="9" fill="#666" text-anchor="middle">tracking...</text>
    <!-- Home button -->
    <circle cx="110" cy="265" r="8" fill="#444"/>
  </g>

  <!-- Arrow -->
  <g id="arrow">
    <path d="M 200 180 Q 300 180 400 180" stroke="#4a90e2" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <text x="300" y="165" font-family="sans-serif" font-size="14" fill="#4a90e2" text-anchor="middle">Later...</text>
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#4a90e2"/>
      </marker>
    </defs>
  </g>

  <!-- Laptop -->
  <g id="laptop">
    <rect x="420" y="120" width="160" height="100" rx="5" fill="#2a2a2a" stroke="#333" stroke-width="2"/>
    <rect x="430" y="130" width="140" height="80" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
    <!-- Screen content - todo list -->
    <text x="435" y="145" font-family="monospace" font-size="8" fill="#333">✓ Design metrics API</text>
    <text x="435" y="158" font-family="monospace" font-size="8" fill="#333">✓ Add DB schema</text>
    <text x="435" y="171" font-family="monospace" font-size="8" fill="#333">✓ Create endpoints</text>
    <text x="435" y="184" font-family="monospace" font-size="8" fill="#666">○ Review & verify</text>
    <!-- Laptop base -->
    <path d="M 400 220 L 410 235 L 590 235 L 600 220 Z" fill="#333" stroke="#222" stroke-width="2"/>
  </g>

  <!-- Labels -->
  <text x="110" y="50" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle" font-style="italic">Jot on phone</text>
  <text x="500" y="270" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle" font-style="italic">Review like a todo list</text>
</svg>
