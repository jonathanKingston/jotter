<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Confused deputy model for agentic browsers</title>
  <desc id="desc">Developer content, user-generated content, and attacker content collapse into the browser representation consumed by an agent. The agent then acts on multiple origins with the user's authority.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#b45309"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #0f172a; font-size: 24px; font-weight: 700; }
      .small { fill: #334155; font-size: 17px; }
      .tiny { fill: #475569; font-size: 15px; }
      .box { stroke-width: 2.5; rx: 16; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .attack { stroke: #b45309; stroke-width: 3; fill: none; marker-end: url(#arrow-red); stroke-dasharray: 9 7; }
    </style>
  </defs>

  <rect x="24" y="24" width="1052" height="572" rx="24" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>

  <text x="62" y="74" class="tiny">Page supplies mixed-trust content</text>
  <text x="432" y="74" class="tiny">Agent receives one flattened page</text>
  <text x="782" y="74" class="tiny">Actions carry user authority</text>

  <rect x="62" y="112" width="270" height="92" class="box" fill="#ecfeff" stroke="#0891b2"/>
  <text x="197" y="148" text-anchor="middle" class="label">Developer content</text>
  <text x="197" y="176" text-anchor="middle" class="small">trusted UI and copy</text>

  <rect x="62" y="252" width="270" height="92" class="box" fill="#eef2ff" stroke="#6366f1"/>
  <text x="197" y="288" text-anchor="middle" class="label">User content</text>
  <text x="197" y="316" text-anchor="middle" class="small">comments, reviews, posts</text>

  <rect x="62" y="392" width="270" height="92" class="box" fill="#fff1f2" stroke="#e11d48"/>
  <text x="197" y="428" text-anchor="middle" class="label">Attacker content</text>
  <text x="197" y="456" text-anchor="middle" class="small">ads, spoofed flows, scams</text>

  <rect x="430" y="218" width="250" height="150" class="box" fill="#ffffff" stroke="#64748b"/>
  <text x="555" y="262" text-anchor="middle" class="label">Agent</text>
  <text x="555" y="294" text-anchor="middle" class="small">reads one browser</text>
  <text x="555" y="322" text-anchor="middle" class="small">stream and decides</text>

  <path class="arrow" d="M332 158 C370 170 390 214 425 255"/>
  <path class="arrow" d="M332 298 H420"/>
  <path class="attack" d="M332 438 C372 423 393 373 425 333"/>

  <rect x="770" y="118" width="226" height="72" class="box" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="883" y="150" text-anchor="middle" class="label">Origin A</text>
  <text x="883" y="174" text-anchor="middle" class="tiny">account data</text>

  <rect x="770" y="256" width="226" height="72" class="box" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="883" y="288" text-anchor="middle" class="label">Origin B</text>
  <text x="883" y="312" text-anchor="middle" class="tiny">forms and posts</text>

  <rect x="770" y="394" width="226" height="72" class="box" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="883" y="426" text-anchor="middle" class="label">Origin C</text>
  <text x="883" y="450" text-anchor="middle" class="tiny">tools and files</text>

  <path class="arrow" d="M680 258 C720 222 728 171 766 154"/>
  <path class="arrow" d="M680 293 H766"/>
  <path class="arrow" d="M680 328 C720 362 728 413 766 430"/>

  <rect x="379" y="500" width="342" height="62" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="550" y="526" text-anchor="middle" class="small">The authority belongs to the user.</text>
  <text x="550" y="548" text-anchor="middle" class="small">The page chooses much of the context.</text>
</svg>
