name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Cobalt
        run: |
          set -euo pipefail
          cargo install cobalt-bin --locked || cargo install cobalt-bin

      - name: Build site
        run: cobalt build


