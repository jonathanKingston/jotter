<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Four levels of agent safety</title>
  <desc id="desc">Capability at the bottom, then norms and policy, authority, and substantive appropriateness at the top. Each level catches a class the others miss.</desc>
  <defs>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #0f172a; font-size: 22px; font-weight: 700; }
      .small { fill: #334155; font-size: 16px; }
      .tiny { fill: #475569; font-size: 14px; }
      .box { stroke-width: 2.5; rx: 14; }
    </style>
  </defs>

  <rect x="20" y="20" width="860" height="520" rx="22" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>

  <text x="450" y="58" text-anchor="middle" class="tiny">Each level catches a class the others miss. The top never fully mechanises.</text>

  <rect x="120" y="88" width="660" height="78" class="box" fill="#fdf2f8" stroke="#db2777"/>
  <text x="450" y="118" text-anchor="middle" class="label">Substantive appropriateness</text>
  <text x="450" y="146" text-anchor="middle" class="small">Is this right for this person and these stakeholders?</text>

  <rect x="120" y="182" width="660" height="78" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="450" y="212" text-anchor="middle" class="label">Authority</text>
  <text x="450" y="240" text-anchor="middle" class="small">Was this action authorised and verifiable?</text>

  <rect x="120" y="276" width="660" height="78" class="box" fill="#eef2ff" stroke="#6366f1"/>
  <text x="450" y="306" text-anchor="middle" class="label">Norms and policy</text>
  <text x="450" y="334" text-anchor="middle" class="small">Should this flow happen here, under your rules?</text>

  <rect x="120" y="370" width="660" height="78" class="box" fill="#ecfeff" stroke="#0891b2"/>
  <text x="450" y="400" text-anchor="middle" class="label">Capability</text>
  <text x="450" y="428" text-anchor="middle" class="small">What powers are combined? (the lethal trifecta)</text>

  <text x="72" y="124" class="tiny">hardest</text>
  <text x="72" y="144" class="tiny">to</text>
  <text x="72" y="164" class="tiny">automate</text>

  <text x="72" y="404" class="tiny">easiest</text>
  <text x="72" y="424" class="tiny">to</text>
  <text x="72" y="444" class="tiny">gate</text>

  <rect x="170" y="478" width="560" height="44" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="450" y="506" text-anchor="middle" class="small">Better models amplify verification where it is tractable, not where it is not.</text>
</svg>
